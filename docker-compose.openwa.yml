version: '3.8'

services:
  # =========================================================================
  # 📱 Dentia OpenWA Gateway (Self-Hosted Real WhatsApp Web API)
  # GitHub: https://github.com/rmyndharis/OpenWA
  # Port: 2785 (Dashboard & Swagger Docs at http://localhost:2785/api/docs)
  # =========================================================================
  openwa-gateway:
    image: rmyndharis/openwa:latest
    container_name: dentia-openwa-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:2785:2785"
    environment:
      - NODE_ENV=development
      - PORT=2785
      - API_KEY=owa_k1_dentia_prod_secret_key_998877_full_secure_key
      - API_MASTER_KEY=owa_k1_dentia_prod_secret_key_998877_full_secure_key
      - ALLOW_DEV_API_KEY=false
      - WEBHOOK_URL=http://host.docker.internal:5000/api/whatsapp/webhook
      - WEBHOOK_SECRET=9cbd786e68def0a5d56feb9400403cbd7a5f27c675a8d2aec3574697993c3484
      - PUPPETEER_EXECUTABLE_PATH=/usr/local/bin/puppeteer-chrome
      - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage
    volumes:
      - openwa_sessions:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - dentia_network

volumes:
  openwa_sessions:
    name: dentia_openwa_sessions

networks:
  dentia_network:
    name: dentia_network
    driver: bridge
